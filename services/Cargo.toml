[workspace]
resolver = "2"
members = [
    "common",
    "indexer",
    "risk-engine",
    "liquidator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Cohort9-Vigil Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-nats = "0.35"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "bigdecimal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ethers = { version = "2.0", default-features = false, features = ["rustls"] }
alloy = { version = "2.5", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
rust_decimal = { version = "1.35", features = ["maths"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }

# Internal workspace crates
common = { path = "common" }
